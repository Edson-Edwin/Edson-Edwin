name: Update profile art

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/fetch_contributions.py
      - scripts/render_heatmap_svg.py
      - scripts/svg_utils.py
      - scripts/test_contributions.py
      - .github/workflows/update-profile-art.yml

permissions:
  contents: write

concurrency:
  group: profile-art-${{ github.ref }}
  cancel-in-progress: false

jobs:
  heatmap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Fetch and render contributions
        run: |
          python -m unittest discover -s scripts -p 'test_*.py'
          python scripts/fetch_contributions.py
          python scripts/render_heatmap_svg.py
      - name: Commit refreshed calendar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json contrib-heatmap.svg
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh contribution graph [skip ci]"
            git push
          fi
